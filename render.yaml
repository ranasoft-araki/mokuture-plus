services:
  - type: web
    name: mokuture-plus-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    region: oregon
    # NOTE: 本番は starter（コールドスタート回避のため有料化済み）。free に戻すと 15分無アクセスで
    # スリープ→起動待ちが再発するので下げないこと。DB(Neon)を us-west-2 に同居させており region も固定。
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DEBUG
        value: "false"
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_BUCKET_NAME
        sync: false
      - key: STORAGE_PUBLIC_URL
        sync: false
      # Slack OAuth (「Slackに追加」). Unset = feature disabled. Set in the Render dashboard.
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        sync: false
      # Slack Interactivity（受付通知の対応ボタン）の署名検証用。未設定ならボタン無し。
      - key: SLACK_SIGNING_SECRET
        sync: false
      # SMTP メール送信（来社予定QRのメール送信）。HOST/USERNAME/PASSWORD が揃うと有効(smtp_enabled)。
      # 全て sync:false = 値は Render ダッシュボードで設定（このリポジトリは公開のため yaml に値を書かない）。
      # hetemail: SMTP_HOST=smtp.hetemail.jp / SMTP_PORT=465 / SMTP_SSL=true / SMTP_STARTTLS=false。
      # 未設定なら送信APIは 503 を返すだけで他機能に影響なし。
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_STARTTLS
        sync: false
      - key: SMTP_SSL
        sync: false
