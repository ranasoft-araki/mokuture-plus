[project]
name = "mokuture-kiosk-agent"
version = "0.1.0"
description = "mokuture+ local kiosk device agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "aiofiles>=24.0.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
rpi = [
    "gpiozero>=2.0",
    "lgpio",
]
# 名刺読み取り（QR無し来訪者の受付フォーム自動入力）。
# 入っていない端末でもキオスク本体は従来どおり起動し、名刺の導線だけが出なくなる。
# opencv は Raspberry Pi OS では apt の python3-opencv を使うほうが速く入る
# （install.sh が apt を先に試し、失敗したら pip に落とす）。
card = [
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "PyYAML>=6.0",
]
# 音声入力（QR無し来訪者の受付フォームを声で埋める / 実験導入）。
# 入っていなくても音声サービスは動く（PyYAML が無ければ voice_input.yaml を読まず
# 既定値のまま、webrtcvad が無ければエネルギーVAD、vosk が無ければ第3・4段階が無効）。
# 録音は arecord（alsa-utils）を使うので Python 依存は増やしていない。
voice = [
    "PyYAML>=6.0",
    # 任意: 入っていれば VAD を webrtcvad に切り替えられる
    # "webrtcvad-wheels>=2.0.14",
    # 任意: 第3・4段階（画面操作・担当者名）で使う
    # "vosk>=0.3.45",
    # 任意: arecord が使えない環境の予備
    # "sounddevice>=0.4.6",
]
dev = [
    "pytest>=8.0",
    "Pillow>=10.0",      # tests/make_fixtures.py が架空名刺の画像を作るのに使う
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ocr: OCR モデルを必要とするテスト（モデル未取得なら自動で skip）",
    "slow: 数秒かかるテスト",
]
