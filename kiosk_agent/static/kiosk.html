// ─── LOCKER (Phase 2) ─────────────────────────────────────────────────────────
// 3段縦並び(上段A/中段B/下段C)。空き=緑/利用中=アンバー。
//  空き  : タッチ→自動開錠(GPIO)→荷物投入→扉を閉める→4桁PIN設定→お預け完了
//  利用中: タッチ→4桁PIN入力→照合OKで開錠(GPIO)→お受け取り
// ※実機に扉開閉センサーが無いため「扉を閉めました」ボタンでPIN設定へ進む(センサー導入時は自動化可)。
const LOCKER_AMBER = "#bd7e2e";

// ロッカーの扉が床から何 cm にあるか。**画面のタイルは同じ大きさでも実物の高さは違う**ので、
// 車いす座位で使えるかどうかを選ぶ前に見せる（Doc/kiosk-voice-touchless.html §05）。
// 比率は什器の線画 v8 の実測座標（フレーム y=61..1472、ロッカー部の仕切り y=718/920/1123/1423）。
//
// **什器の全高（床から天面まで）が分からないと cm は出せない**ので、設定されていなければ
// 何も出さない（推測した数字を出さない）。段の別は名称（A（上段）等）が元から伝えている。
// 出したい場合は受付設定に kiosk_fixture_height_mm（実測値）を入れること。
const FIXTURE_Y = { bottom: 1472, span: 1411 };
const LOCKER_TIER_Y = [[920, 718], [1123, 920], [1423, 1123]];   // [下端, 上端] 上段→下段
function lockerDoorHeightMm(locker, all) {
  const h = Number(ST.kiosk_fixture_height_mm);
  if (!h || !isFinite(h) || h <= 0) return null;
  // 段の対応が線画から決まるのは 3 段構成のときだけ。7 口では扉と段の対応が図から読めない。
  if (!Array.isArray(all) || all.length !== 3) return null;
  const idx = all.indexOf(locker);
  if (idx < 0 || idx > 2) return null;
  const [y0, y1] = LOCKER_TIER_Y[idx];
  const mm = (y) => (FIXTURE_Y.bottom - y) / FIXTURE_Y.span * h;
  const lo = mm(y0), hi = mm(y1);
  return { lo: Math.round(lo / 10), hi: Math.round(hi / 10), low: hi < 450 };
}
// mode: "store"(手荷物一時保管=空きロッカーのみ) / "pickup"(荷物受け取り=PIN設定済のみ) / "all"(旧・両方)
function showLocker(mode) {
  mode = mode || "all";
  const isStore = mode === "store", isPickup = mode === "pickup";
  const bc = ST.brand_color;
  const token = localStorage.getItem(TOKEN_KEY);
  let lockers = [], available = 0, shownLockers = [];
  let view = "loading";      // loading | grid | openwait | pinset | pininput | result | error
  let sel = null, pin = "", err = "", busy = false, resultTitle = "", resultSub = "", resultTitleEn = "", resultSubEn = "";
  let resultGuide = false;   // result 画面で扉ガイド(どの扉を開けるか)を出すか=解錠(受取)成功時のみ
  let idleId, resultTimer = null, lastView = "loading";
  let doorWatchId = null, doorOpenedSinceWait = false, doorAutoAdvancing = false;

  let countId = null, idleLeft = ST.kiosk_idle_timeout_sec;
  const paintIdle = () => paintIdleMeter("lk-idle", idleLeft, ST.kiosk_idle_timeout_sec);
  function resetIdle() {
    clearTimeout(idleId); clearInterval(countId); hideIdlePrompt();
    idleLeft = ST.kiosk_idle_timeout_sec;
    paintIdle();
    idleId = setTimeout(() => { anEnd("timeout"); cleanup(); go("idle"); }, ST.kiosk_idle_timeout_sec * 1000);
    countId = setInterval(() => {
      idleLeft--; if (idleLeft <= 0) { clearInterval(countId); return; }
      paintIdle();
      // 暗証番号を入れている途中で黙って消さない(入れ直しは負担が大きい)。
      if (idleLeft === IDLE_PROMPT_AT && (view === "pininput" || view === "pinset")) showIdlePrompt(resetIdle);
    }, 1000);
  }
  function stopDoorWatch() {
    if (doorWatchId) {
      clearInterval(doorWatchId);
      doorWatchId = null;
    }
    doorOpenedSinceWait = false;
    doorAutoAdvancing = false;
  }
  CLEANUPS.push(() => { clearTimeout(idleId); if (resultTimer) clearTimeout(resultTimer); stopDoorWatch(); });

  async function getSelectedDoorClosedState() {
    if (!sel) return null;
    try {
      const r = await deviceGet("/device/door");
      const doors = Array.isArray(r?.doors) ? r.doors : [];
      const door = doors.find(d => String(d.door_id) === String(sel.door_number) || String(d.door_id) === String(sel.id));
      if (!door || !door.configured || typeof door.is_closed !== "boolean") return null;
      return door.is_closed;
    } catch {
      return null;
    }
  }

  function startDoorWatch() {
    stopDoorWatch();
    if (!sel) return;
    let inFlight = false;
    doorWatchId = every(250, async () => {
      if (view !== "openwait" || !sel || doorAutoAdvancing || inFlight) return;
      inFlight = true;
      try {
        const isClosed = await getSelectedDoorClosedState();
        if (isClosed == null) return;
        if (!doorOpenedSinceWait) {
          if (isClosed === false) doorOpenedSinceWait = true;
          return;
        }
        if (isClosed === true) {
          doorAutoAdvancing = true;
          stopDoorWatch();
          await forceLockLocker(sel.door_number);
          pin = "";
          err = "";
          view = "pinset";
          render();
        }
      } finally {
        inFlight = false;
      }
    });
  }

  // 上端には待機メーターだけを残し、押すもの(戻る/やめる/担当者を呼ぶ)は下部の帯へ集める。
  // 暗証番号の画面は到達線の下が狭いので slim 版(戻る＋担当者を呼ぶ)にしてテンキーの高さを稼ぐ。
  const shell = (inner, bandOpts) => `<div style="width:1920px;height:1080px;background:${T.bg};display:flex;flex-direction:column;font-family:'Noto Sans JP',Inter,system-ui,sans-serif">
  <div style="padding:24px 80px 0;flex-shrink:0;display:flex;align-items:center;gap:24px"><div style="flex:1"></div>${idleMeterHtml("lk-idle")}<div style="flex:1"></div></div>
  ${inner}
  ${bottomBandHtml(bandOpts || {})}
</div>`;

  function render() {
    resetIdle();
    if (view === "loading") {
      sc.innerHTML = shell(`<div style="flex:1;display:flex;align-items:center;justify-content:center"><div style="width:54px;height:54px;border-radius:50%;border:4px solid ${T.border};border-top-color:${bc};animation:spin .8s linear infinite"></div></div>`);
    } else if (view === "error") {
      sc.innerHTML = shell(`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px">
        ${bi("ロッカーを利用できません", "Lockers are unavailable", { big: "40px", small: "22px", bigColor: T.ink, smallColor: T.sub, bigWeight: "600", dir: "column", align: "center", gap: "8px" })}
        <div style="font-size:22px;color:${T.sub}">${escHtml(err || "しばらくしてからお試しください")}</div></div>`);
    } else if (view === "grid") {
      shownLockers = isStore ? lockers.filter(l => !l.occupied)
                   : isPickup ? lockers.filter(l => l.occupied && l.has_pin)
                   : lockers;
      const gridTitle = isStore ? "手荷物一時保管" : isPickup ? "荷物受け取り" : "ロッカー";
      const gridTitleEn = isStore ? "Store your belongings" : isPickup ? "Pick up your item" : "Lockers";
      const counter = isPickup
        ? bi("お預かり中", "Held", { big: "26px", small: "16px", gap: "10px", wrap: "align-items:center;display:inline-flex" }) + ` <b style="font-size:34px;color:${LOCKER_AMBER}">${shownLockers.length}</b>`
        : bi("空き", "Available", { big: "26px", small: "16px", gap: "10px", wrap: "align-items:center;display:inline-flex" }) + ` <b style="font-size:34px;color:${bc}">${isStore ? shownLockers.length : available}</b> / ${bi("全", "Total", { big: "26px", small: "16px", gap: "6px", wrap: "align-items:center;display:inline-flex" })} ${lockers.length}`;
      const emptyMsg = isStore ? "現在ご利用いただける空きロッカーがありません"
                     : isPickup ? "お預かり中のお荷物が見つかりません" : "ロッカーがありません";
      const emptyMsgEn = isStore ? "No empty lockers are available right now"
                     : isPickup ? "No items found" : "No lockers";
      const body = shownLockers.length === 0
        ? `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
          ${bi(emptyMsg, emptyMsgEn, { big: "40px", small: "24px", bigColor: T.ink, smallColor: T.sub, bigWeight: "600", dir: "column", align: "center", gap: "8px" })}
          ${bi("「← 戻る」でお戻りください", "Tap “← Back” to return", { big: "24px", small: "16px", bigColor: T.sub, smallColor: T.muted, dir: "column", align: "center", gap: "4px" })}
        </div>`

      sc.innerHTML = shell(`

    } else if (view === "openwait") {

        sc.innerHTML = `<div style="width:1920px;height:1080px;position:relative;background:#f5f2ec;font-family:'Noto Sans JP',Inter,system-ui,sans-serif">

          ${homeBtnCornerHtml("lk-home")}

      } else {

      const dots = Array.from({ length: 4 }, (_, i) => `<div style="width:30px;height:30px;border-radius:50%;border:2px solid ${i < pin.length ? bc : T.borderStrong};background:${i < pin.length ? bc : "transparent"}"></div>`).join("");

      const PAD = ["1","2","3","4","5","⌫","6","7","8","9","0","→"];

        <div style="font-size:22px;color:${T.muted};margin-top:6px">${escHtml(sel.name)} ・ 4桁 (4 digits)</div>
        <div style="display:flex;gap:22px;justify-content:center;margin-top:18px">${dots}</div>
      </div>
      <div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 80px">
        ${err ? `<div style="padding:12px 24px;background:${T.urgentBg};border:1px solid rgba(168,66,56,.3);border-radius:10px;color:${T.urgent};font-size:24px">${escHtml(err)}</div>` : ""}
      </div>
      <div style="flex:none;display:flex;justify-content:center;padding:0 80px 12px">
        <div style="display:grid;grid-template-columns:repeat(6,200px);gap:14px">${padHtml}</div>
      </div>`, { slim: true });
    }
    rescale();
    paintIdle();   // render() は resetIdle() のあとに innerHTML を差し替えるので描き戻す
    if (view !== lastView) { lastView = view; softEnter(sc.firstElementChild); }  // view切替時のみ立ち上げ(PIN連打では動かさない)

    // 「戻る」は必ず 1 つ前へ。画面内のステップも 1 つずつ戻す。
    // 以前は暗証番号の画面からでも一気に外(モード選択)へ出ていたので、口を押し
    // 間違えただけの人がモード選択からやり直しになっていた。
    bindBottomBand({
      onBack: () => {
        if (view === "pininput" || view === "pinset") { pin = ""; err = ""; sel = null; view = "grid"; render(); return; }
        cleanup(); go(mode === "all" ? "top" : "lockerMode");
      },
    });
    // 解錠ガイド(openwait)と扉ガイド付き result は shell を使わない全画面で、
    // 右上の角に「やめる」を持つ。下部帯は出ないのでこちらを個別に束縛する。
    bindHomeBtn("lk-home");

    if (view === "grid") {
      const doors = document.getElementById("lk-doors");
      if (doors) doors.addEventListener("click", e => {
        const btn = e.target.closest("[data-li]"); if (!btn || btn.disabled) return;  // 配達保管中(disabled)は無視
        resetIdle();
        sel = shownLockers[+btn.dataset.li];
        if (sel.occupied) { pin = ""; err = ""; view = "pininput"; render(); }  // 利用中(PIN有)=荷物受け取り

      });
    } else if (view === "openwait") {
      startDoorWatch();
      document.getElementById("lk-closed").addEventListener("click", async () => {
        resetIdle();
        stopDoorWatch();
        await forceLockLocker(sel.door_number);
        pin = "";
        err = "";
        view = "pinset";
        render();
      });
    } else if (view === "result") {
      // デモの手荷物預け完了(resultGuide無し=お預け完了)は、そのまま取り出し操作へ自動誘導する。
      const demoDeposit = ST.is_demo && !resultGuide;
      const dn = document.getElementById("lk-done");
      if (dn) dn.addEventListener("click", () => {
        if (demoDeposit) { goDemoPickup(); } else { goAfterResult(); }
      });
      const total = Math.max(6, ST.kiosk_complete_timeout_sec);
      const barEl = document.getElementById("lk-bar"), cntEl = document.getElementById("lk-cnt");
      if (barEl || cntEl) {
        // 受取(全画面案内)は他画面と同じく自動遷移までのタイムバー＋残り秒を表示。
        let c = total;
        every(1000, () => {
          c--;
          if (c <= 0) { goAfterResult(); return; }
          if (barEl) barEl.style.width = `${(c / total) * 100}%`;
          if (cntEl) cntEl.textContent = c;
        });

        resultTimer = setTimeout(goDemoPickup, 3500);
      } else {
        resultTimer = setTimeout(() => { goAfterResult(); }, total * 1000);
      }
    } else if (view === "pinset" || view === "pininput") {
      sc.querySelectorAll("[data-pk]").forEach(b => b.addEventListener("click", () => handleKey(b.dataset.pk)));
    }
    // 口は番号(いちばん〜ななばん)で選べる。空きの口は選ぶと錠が開くので、声で選んだときだけ
    // 確認を挟む(vcLockerItems)。**暗証番号の画面ではマイクを開けない**(ロビーで番号を読み上げさせない)。

      voiceCommands("lockerDoor", [
        vcDoorClosedItem("#lk-closed", "「はい」で錠をかけて、暗証番号の設定へ進みます", resetIdle),

      voiceCommands("lockerResult", [vcItem("result.done", "#lk-done"), vcItem("common.home", "#lk-home")],

    } else {

                    { onActivity: resetIdle, fallback: view === "grid" });

  function handleKey(k) {
    if (busy) return;
    resetIdle();
    // 入力開始だけを記録する（押された数字は渡さない。ロガー側でも [data-pk] は除外）。
    if (!pin) AN.inputStarted("locker_pin", "touch");
    if (k === "⌫") { pin = pin.slice(0, -1); err = ""; render(); }
    else if (k === "→") { if (pin.length === 4) submitPin(); }
    else if (pin.length < 4) { pin += k; err = ""; render(); }  // 4桁入力後は「決定」待ち
  }

  async function openEmpty() {
    // 空きロッカー: GPIOで開錠 → 荷物投入待ち
    pulseLocker(sel.door_number).catch(() => {});
    doorOpenedSinceWait = false;
    doorAutoAdvancing = false;
    view = "openwait"; render();
  }

  async function submitPin() {
    busy = true; render();
    try {
      if (view === "pinset") {
        // 審査用デモ: 入力/完了表示は本番のまま、内部の保存PINだけ固定値へ差し替える(受取もこれで解錠)。
        const pinToSet = ST.is_demo ? (ST.demo_locker_pin || "0805") : pin;
        await devicePost(`/device/locker/${encodeURIComponent(sel.id)}/occupy`, { pin: pinToSet });
        resultGuide = false;
        resultTitle = "お預け完了"; resultSub = "暗証番号を設定しました。お受け取りの際に入力してください。";
        resultTitleEn = "Stored"; resultSubEn = "Your PIN has been set. Enter it when you come back to pick up your item.";
      } else {
        const r = await devicePost(`/device/locker/${encodeURIComponent(sel.id)}/release`, { pin });
        await pulseLocker((r && r.door_number) || sel.door_number);
        resultGuide = true;
        resultTitle = "解錠しました"; resultSub = `${sel.name} の扉が開きました。扉の右側を押して開け、お荷物をお受け取りください。`;
      }
      AN.inputCompleted("locker_pin", "touch");
      AN.errorRecovered("locker_pin");   // 番号違いのあとに通ったら「修正完了」として残る
      busy = false; view = "result"; render();
    } catch (e) {
      busy = false; pin = "";
      const msg = e && e.message ? e.message : "";
      // 記録するのはエラーコードだけ（入力された暗証番号は渡さない）。
      AN.validationError("locker_pin",
        msg === "invalid pin" ? "pin_mismatch"
        : msg === "already occupied" ? "locker_occupied"
        : msg === "not occupied" ? "no_locker_available" : "unknown");
      err = msg === "invalid pin" ? "暗証番号が違います。もう一度お試しください。"
          : msg === "already occupied" ? "このロッカーは使用中です。"
          : msg === "not occupied" ? "このロッカーは空いています。"
          : ("処理に失敗しました：" + (msg || "もう一度お試しください"));
      render();
    }
  }

  async function load() {
    try {
      const r = await deviceGet("/device/locker-list");
      lockers = r.lockers || [];
      available = r.available_count ?? lockers.filter(l => !l.occupied).length;
      view = "grid"; render();
    } catch (e) {
      err = e && e.message ? e.message : ""; view = "error"; render();
    }
  }

  // デモ: 手荷物預け完了 → 「デモモードのため自動で取り出し操作に移ります」案内を挟み、
  // 取り出し(pickup)のロッカー選択画面へ自動遷移する(デモ店舗のみ・審査用の一連の流れ)。
  function goDemoPickup() {
    cleanup();   // result/idle タイマーを停止(以降はこの案内画面が自前で遷移する)
    const secs = 4;
    sc.innerHTML = `<div style="width:1920px;height:1080px;background:${T.bg};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center;padding:0 160px;font-family:'Noto Sans JP',Inter,system-ui,sans-serif">
      <div style="display:inline-flex;align-items:center;gap:12px;padding:12px 30px;border-radius:999px;background:rgba(20,18,15,.82);color:#fff;font-size:26px;font-weight:700;letter-spacing:.3px">デモモード</div>
      <div style="width:132px;height:132px;border-radius:50%;background:${LOCKER_AMBER}22;color:${LOCKER_AMBER};display:flex;align-items:center;justify-content:center;animation:scale-in .5s cubic-bezier(.2,.9,.3,1.1)"><div style="transform:scale(2.2)">${ICO.pin}</div></div>
      <div style="font-size:62px;font-weight:700;color:${T.ink};letter-spacing:-1.5px;line-height:1.25">デモモードのため<br>自動で取り出し操作に移ります</div>
      <div style="font-size:34px;color:${T.sub};line-height:1.5">続けてお荷物のお受け取り画面をご案内します</div>
      <div style="display:flex;align-items:center;gap:14px;color:${T.muted};font-size:24px;margin-top:6px">${ICO.clock}<span>まもなく移動します</span><span id="dh-cnt" style="font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;color:${LOCKER_AMBER};min-width:34px;text-align:right">${secs}</span><span>秒</span><div style="width:240px;height:8px;background:${T.border};border-radius:4px;overflow:hidden"><div id="dh-bar" style="width:100%;height:100%;background:${LOCKER_AMBER};border-radius:4px;transition:width 1s linear"></div></div></div>
      <button id="dh-next" style="margin-top:14px;padding:22px 66px;border:none;border-radius:16px;background:${LOCKER_AMBER};color:#fff;font-size:30px;font-weight:700;cursor:pointer;font-family:inherit">手動で次へ →</button>
    </div>`;
    rescale();
    softEnter(sc.firstElementChild);
    CURRENT_SCREEN = "demoHandoff";   // 次の go("locker") で locker→locker と誤判定させずクロス遷移させる
    const barEl = document.getElementById("dh-bar"), cntEl = document.getElementById("dh-cnt");
    let c = secs, done = false, tick = null;
    const advance = () => { if (done) return; done = true; if (tick) clearInterval(tick); go("locker", { mode: "pickup" }); };
    tick = setInterval(() => {
      c--;
      if (c <= 0) { advance(); return; }
      if (barEl) barEl.style.width = `${(c / secs) * 100}%`;
      if (cntEl) cntEl.textContent = c;
    }, 1000);
    const nb = document.getElementById("dh-next");
    if (nb) nb.addEventListener("click", advance);   // 手動で即座に取り出し操作へ
    CLEANUPS.push(() => { if (tick) clearInterval(tick); });
  }

  resetIdle();
  onSc("click", resetIdle);   // 永続要素 sc に一度だけ登録(画面操作でアイドルタイマー延長)
  render();   // loading
  load();
}

  function resetIdle() {
    clearTimeout(idleId); clearInterval(countId);
    idleLeft = ST.kiosk_idle_timeout_sec;
    paintIdle();
    // 呼び出し後の応答待ちは待機タイマーを止めておく(スタッフの返信前に待機画面へ戻らない)。
    // 画面のどこを押しても(声の確認の「いいえ」も sc へ伝わる)ここが呼ばれるので、ここで止める。
    if (view === "wait") return;

    countId = setInterval(() => {
      idleLeft--; if (idleLeft <= 0) { clearInterval(countId); return; }
      paintIdle();
    }, 1000);
  }
  CLEANUPS.push(() => { clearTimeout(idleId); clearInterval(countId); if (resultTimer) clearTimeout(resultTimer); });

  // 他の画面と同じく、押すものは下部の常設帯へ。上端は待機メーターだけ。
  const shell = (inner) => `<div style="width:1920px;height:1080px;background:${T.bg};display:flex;flex-direction:column;font-family:'Noto Sans JP',Inter,system-ui,sans-serif">
  <div style="padding:24px 80px 0;flex-shrink:0;display:flex;align-items:center;gap:24px"><div style="flex:1"></div>${idleMeterHtml("dl-idle")}<div style="flex:1"></div></div>
  ${inner}
  ${bottomBandHtml()}
</div>`;

  function render() {
    resetIdle();
    if (view === "loading" || view === "sending") {
      sc.innerHTML = shell(`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px"><div style="width:56px;height:56px;border-radius:50%;border:4px solid ${T.border};border-top-color:${bc};animation:spin .8s linear infinite"></div>${view === "sending" ? bi("担当者に通知しています…", "Notifying staff…", { big: "26px", small: "17px", bigColor: T.sub, smallColor: T.muted, dir: "column", align: "center", gap: "2px" }) : ""}</div>`);
    } else if (view === "error") {
      sc.innerHTML = shell(`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px">
        ${bi("処理できませんでした", "Something went wrong", { big: "40px", small: "22px", bigColor: T.ink, smallColor: T.sub, bigWeight: "600", dir: "column", align: "center", gap: "8px" })}
        <div style="font-size:22px;color:${T.sub}">${escHtml(err || "受付スタッフへお声がけください")}</div></div>`);
    } else if (view === "choose") {
      const noLocker = available <= 0;
      sc.innerHTML = shell(`
  <div style="padding:14px 80px 0;flex-shrink:0">${bi("配達方法をお選びください", "Please choose a delivery method", { big: "58px", small: "36px", bigColor: T.ink, smallColor: T.muted, bigWeight: "600", dir: "column", align: "flex-start", gap: "6px", wrap: "letter-spacing:-1.5px" })}</div>

      <div style="width:150px;height:150px;border-radius:34px;background:${noLocker ? T.border : bc + "22"};color:${noLocker ? T.muted : bc};display:flex;align-items:center;justify-content:center"><div style="transform:scale(2.3)">${ICO.locker}</div></div>

    } else if (view === "pick") {

  <div id="dl-doors" style="flex:1;display:flex;flex-direction:column;gap:16px;padding:20px 80px 36px;min-height:0">
    ${lockers.map((l, i) => {
      const used = l.occupied, accent = used ? LOCKER_AMBER : bc;
      return `<button data-li="${i}" ${used ? "disabled" : ""} style="position:relative;display:flex;align-items:center;gap:40px;width:100%;flex:1;min-height:0;background:${used ? "#f4f1ea" : "#eef4ee"};border:3px solid ${accent};border-radius:22px;padding:0 52px;cursor:${used ? "not-allowed" : "pointer"};opacity:${used ? .55 : 1};text-align:left">
        <div style="width:104px;height:140px;border-radius:12px;background:${T.canvas};border:3px solid ${accent};position:relative;flex-shrink:0"><div style="position:absolute;top:50%;right:14px;transform:translateY(-50%);width:9px;height:46px;border-radius:5px;background:${accent}"></div></div>
        <div style="flex:1"><div style="font-size:54px;font-weight:700;color:${T.ink}">${escHtml(l.name)}</div>
          <div style="margin-top:10px;display:inline-block;padding:6px 18px;border-radius:999px;background:${accent};color:#fff">${bi(used ? "利用中" : "空き", used ? "In use" : "Available", { big: "24px", small: "16px", bigWeight: "600", gap: "8px" })}</div></div>
        <div style="color:${accent};font-weight:600;flex-shrink:0">${used ? `<span style="font-size:24px">—</span>` : bi("このロッカーに入れる →", "Put item here →", { big: "24px", small: "16px", bigWeight: "600", dir: "column", align: "flex-end", gap: "1px" })}</div>
      </button>`;

  </div>`);
    } else if (view === "openwait") {
      // 置き配の開錠も同じ「取っ手を押して開けて」の全画面ガイドに統一。
      sc.innerHTML = `<div style="width:1920px;height:1080px;position:relative;background:#f5f2ec;font-family:'Noto Sans JP',Inter,system-ui,sans-serif">
        ${lockerPushGuideScreen(sel, lockers, { badge: "解錠しました", badgeEn: "Unlocked", title: "扉を押して開けてください", titleEn: "Push the door to open it", subtitle: "荷物を入れたら扉を閉めてください（暗証番号は不要）", subtitleEn: "Place your item inside, then close the door (no PIN needed)" })}

        <div style="position:absolute;left:0;right:0;bottom:50px;z-index:5;display:flex;justify-content:center"><button id="dl-lock" style="padding:22px 84px;border:none;border-radius:16px;background:${T.dark};color:#fff;cursor:pointer;font-family:inherit">${bi("扉を閉めました（施錠する）", "Door closed (lock it)", { big: "32px", small: "18px", bigColor: "#fff", smallColor: "rgba(255,255,255,.75)", bigWeight: "700" })}</button></div>
      </div>`;
    } else if (view === "wait") {
      // 呼び出し後の「お待ちください」画面
      sc.innerHTML = shell(`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center;padding:0 120px">
        <div style="position:relative;width:300px;height:300px;flex-shrink:0">
          ${[1,.7,.4].map((s,i) => `<div style="position:absolute;inset:${(1-s)*40}%;border:2px solid ${bc};border-radius:50%;opacity:${.15+i*.18};animation:ring-expand 2.6s ease-in-out ${i*.25}s infinite"></div>`).join("")}
          <div style="position:absolute;inset:32%;background:${bc};border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 32px ${bc}72">${ICO.bell_lg}</div>
        </div>
        ${bi("お待ちください", "Please wait", { big: "88px", small: "32px", bigColor: T.ink, smallColor: T.sub, bigWeight: "600", dir: "column", align: "center", gap: "10px", wrap: "letter-spacing:-3px;line-height:1.05" })}
        ${bi("担当者に通知しました。担当者がまいりますので、少々お待ちください。", "A staff member has been notified and is on their way. Please wait a moment.",

        <div style="display:inline-flex;align-items:center;gap:10px;padding:10px 22px;border-radius:999px;background:${bc}1a;color:${bc}">${ICO.check_sm}${bi("通知を送信しました", "Notification sent", { big: "18px", small: "13px", bigWeight: "600" })}</div>
      </div>`);
    } else { // result
      sc.innerHTML = shell(`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:0 120px">
        <div style="width:110px;height:110px;border-radius:50%;background:${bc}22;color:${bc};display:flex;align-items:center;justify-content:center;animation:scale-in .5s cubic-bezier(.2,.9,.3,1.1)">${ICO.check_lg}</div>
        ${bi(resultTitle, resultTitleEn, { big: "64px", small: "28px", bigColor: T.ink, smallColor: T.muted, bigWeight: "600", dir: "column", align: "center", gap: "8px", wrap: "letter-spacing:-2px" })}
        ${bi(resultSub, resultSubEn, { big: "30px", small: "19px", bigColor: T.sub, smallColor: T.muted, dir: "column", align: "center", gap: "4px", wrap: "line-height:1.5" })}
        <button id="dl-done" style="margin-top:10px;padding:24px 68px;border:2px solid ${T.borderStrong};border-radius:16px;background:${T.canvas};color:${T.sub};cursor:pointer">${bi("完了", "Done", { big: "28px", small: "17px", bigWeight: "600" })}</button>
      </div>`);
    }

    paintIdle();   // render() は resetIdle() のあとに innerHTML を差し替えるので描き戻す
    if (view !== lastView) { lastView = view; softEnter(sc.firstElementChild); }  // view切替時のみ立ち上げ

    bindBottomBand({
      onBack: () => {
        if (view === "pick" || view === "openwait") { view = "choose"; render(); }
        else { cleanup(); go("top"); }
      },
    });
    // 扉ガイド付きの全画面(shell を使わない view)は右上の角に「やめる」を持つ。
    bindHomeBtn("dl-home");

    if (view === "choose") {
      const lk = document.getElementById("dl-locker");
      if (lk && available > 0) lk.addEventListener("click", () => { resetIdle(); view = "pick"; render(); });
      document.getElementById("dl-call").addEventListener("click", () => { resetIdle(); callStaff(); });
    } else if (view === "pick") {
      document.getElementById("dl-doors").addEventListener("click", e => {
        const btn = e.target.closest("[data-li]"); if (!btn || btn.disabled) return;
        resetIdle(); sel = lockers[+btn.dataset.li]; openForDelivery();
      });
    } else if (view === "openwait") {
      document.getElementById("dl-lock").addEventListener("click", () => { resetIdle(); lockDelivery(); });
    } else if (view === "wait") {
      // スタッフの応答(受付/電話)をポーリングし、結果画面へ切替。無応答は「電話」扱い。
      // 受付フロー(showCalling)と同じ仕組み。応答待ちの間は無操作タイムアウトを止める。
      clearTimeout(idleId);
      if (callId) {
        const ptoken = localStorage.getItem(TOKEN_KEY);
        let settled = false;
        const finish = (screen) => { if (settled) return; settled = true; go(screen, {}); };
        every(2500, async () => {
          if (settled) return;
          try {
            const r = await apiGet("/proxy/reception/" + encodeURIComponent(callId), ptoken);
            if (r && r.state === "accepted") finish("resultOk");
            else if (r && (r.state === "phone" || r.state === "declined")) finish("resultPhone");
          } catch (_) { /* 通信不調は無視。下のタイムアウトで必ず離脱 */ }
        });
        // 無応答フォールバック: 90秒で電話案内へ(配達員が電話できるように)。
        later(90000, () => finish("resultPhone"));
      } else {
        // 受付IDが無く応答をポーリングできない場合: 一定時間で電話案内へ(応答不明時も電話で呼び出せるように)。
        resultTimer = setTimeout(() => { cleanup(); go("resultPhone", {}); }, Math.max(30, ST.kiosk_complete_timeout_sec * 3) * 1000);

      document.getElementById("dl-done").addEventListener("click", () => { goAfterResult(); });

    if (view === "choose") {

          title: "担当者を呼び出しますか？",
          sub: "「はい」で担当者にお知らせします",

      voiceCommands("deliveryResult", [vcItem("result.done", "#dl-done")], { onActivity: resetIdle });
    } else if (view === "pick" || view === "error") {
      voiceCommands("delivery", view === "pick" ? vcLockerItems("#dl-doors", lockers, resetIdle) : [],
                    { onActivity: resetIdle, fallback: view === "pick" });
    } else if (view === "openwait") {
      voiceCommands("deliveryDoor", [
        vcDoorClosedItem("#dl-lock", "「はい」で錠をかけて、担当者にお知らせします", resetIdle),
        vcItem("common.home", "#dl-home"),
      ], { common: false, onActivity: resetIdle });
    } else if (view === "wait") {
      // 応答待ちの間は待機タイマーを止めている。声で延ばす(onActivity)と止めたタイマーが動き出すので渡さない。
      voiceCommands("deliveryWait", []);
    } else {
      voiceCommands("deliveryBusy", [], { common: false });
    }
  }

  async function openForDelivery() {
    // 開錠パルス(GPIO)は待たずに即「扉が開きました」へ。await すると開錠パルス長(LOCKER_PULSE_SEC)
    // が経過するまで画面が固まる。通常ロッカーの openEmpty と挙動を揃える。
    pulseLocker(sel.door_number).catch(() => {});
    view = "openwait"; render();
  }
  async function lockDelivery() {
    view = "sending"; render();
    await forceLockLocker(sel.door_number);   // 物理施錠(通常ロッカーの「扉を閉めました」と同経路)
    try {
      await devicePost(`/device/locker/${encodeURIComponent(sel.id)}/occupy-delivery`);
      AN.inputCompleted("delivery_method", "touch");
      resultTitle = "お預け完了"; resultSub = "施錠しました。担当者がお受け取りします（暗証番号は不要です）。";
      resultTitleEn = "Stored"; resultSubEn = "Locked. A staff member will collect it (no PIN needed).";
      view = "result"; render();
    } catch (e) {
      AN.apiError("locker_open_failed", { fieldId: "delivery_method" });
      err = (e && e.message) || ""; view = "error"; render();
    }
  }
  async function callStaff() {
    view = "sending"; render();
    try {
      AN.notificationRequested();
      // analytics_session_id は通知の成否をこの匿名セッションへ書き戻すためだけに送る（DB非保存）。
      const r = await apiPost("/proxy/call-staff", { message: "", analytics_session_id: AN.sessionId() }, token);
      callId = (r && r.id) || null;   // 応答(受付/電話)ポーリング用の受付ID
      view = "wait"; render();        // お待ちください画面へ(応答をポーリング)
    } catch (e) {
      AN.apiError("api_5xx", { fieldId: "delivery_method" });
      resultTitle = "通知に失敗しました"; resultSub = "恐れ入りますが、受付スタッフへお声がけください。";
      resultTitleEn = "Notification failed"; resultSubEn = "We're sorry — please speak to a staff member at reception.";
      view = "result"; render();
    }
  }

  async function load() {
    try {
      const r = await deviceGet("/device/locker-list");
      lockers = r.lockers || [];
      available = r.available_count ?? lockers.filter(l => !l.occupied).length;
      view = "choose"; render();
    } catch (e) {
      err = (e && e.message) || ""; view = "error"; render();
    }
  }

  resetIdle();
  onSc("click", resetIdle);
  render();   // loading
  load();
}

// ─── 名刺読み取り (QR無し来訪の受付フォーム自動入力) ──────────────────────────
// カメラはブラウザ(getUserMedia)が握り、フレームを端末内のローカルAPI(/card/*)へ送る。
// 検出・自動撮影判定・OCR・項目抽出はすべて端末内(Python側)で完結し、外部には一切
// 送信しない。画像は端末にもサーバにも保存せず、確定/やり直し/中断のいずれでも破棄する。
//
// 画面は 2 段構え:
//   1) スキャン  … 左=カメラ映像+四隅の枠、右=案内文言と操作
//   2) 確認      … 左=補正後の名刺画像、右=抽出項目(信頼度で色分け・その場で修正可)
// 確認せずに受付が確定することはない。
const CARD = { status: null, checked: false };

// ?carddebug=1 で読み取り画面に状態と数値を重ねて出す(調整・実機調査用)。MOCK と同じく
// 明示オプトインを localStorage に覚える。解除は ?carddebug=0。
// 案内文言だけでは「検出できていない」のか「フレームの送信自体が失敗している」のかを
// 区別できない(送信に失敗したフレームは黙って捨てるので、初期文言が残り続ける)。
// 実機の Chromium はキオスク表示でアドレスバーが無いので、設定画面(Ctrl+Shift+M)と
// 同じ作法でキーボードからも切り替えられるようにしてある(Ctrl+Shift+D)。
const CARD_DEBUG_KEY = "mokuture_card_debug";
let CARD_DEBUG = (() => {
  const p = new URLSearchParams(location.search);
  if (p.has("carddebug")) {
    const v = p.get("carddebug");
    const on = v !== "0" && v !== "false";
    try { on ? localStorage.setItem(CARD_DEBUG_KEY, "1") : localStorage.removeItem(CARD_DEBUG_KEY); } catch {}
    return on;
  }
  try { return localStorage.getItem(CARD_DEBUG_KEY) === "1"; } catch { return false; }
})();

// 名刺APIはローカルエージェント直通。MOCK(?mock=1)や未導入端末では status が取れず、
// 導線そのものを出さない。
async function cardApi(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: body != null ? { "Content-Type": "application/json" } : {},
    body: body != null ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({ detail: r.statusText }));
    throw cardError(r.status, e.detail);
  }
  return r.status === 204 ? null : r.json();
}

async function cardPostImage(path, blob) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob });
  if (!r.ok) {
    const e = await r.json().catch(() => ({ detail: r.statusText }));
    throw cardError(r.status, e.detail);
  }
  return r.json();
}

// HTTP ステータスを例外に残す。403(ループバック外)・404(セッション切れ)・500 を
// 画面のデバッグ表示で見分けるため。文面は今までどおり detail をそのまま使う。
function cardError(status, detail) {
  const e = new Error(detail ?? "card request failed");
  e.status = status;
  return e;
}

// 起動時に一度だけ利用可否を調べる。失敗しても例外は投げない(名刺導線を隠すだけ)。
async function ensureCardStatus() {
  if (CARD.checked) return CARD.status;
  CARD.checked = true;
  if (MOCK) return null;
  try {
    const s = await cardApi("GET", "/card/status");
    CARD.status = s && s.available ? s : null;
  } catch { CARD.status = null; }
  return CARD.status;
}
function cardAvailable() { return !!(CARD.status && CARD.status.available); }

// 確定して受付フォームへ渡す項目の順序。**受付に使うのは お名前・会社名・部署 の
// 3 つだけ**で、残りは confirm と同時に破棄される(applyCardValues 参照)。
const CARD_FIELD_ORDER = [
  "company_name", "person_name", "person_name_kana", "department", "title",
  "email", "phone", "mobile", "fax", "postal_code", "address", "website",
];
// 名刺読み取りのオーバーレイを開く(受付フォームの「名刺で入力」から)。
// 読み取れたら**確認画面を出さずに** onConfirm(values) を呼んで閉じる。呼び出し側の
// 受付フォームはそのまま生きているので、入力途中の値は失われない。
function openCardCapture({ onConfirm }) {
  const bc = ST.brand_color;
  const st = CARD.status || {};
  const cap = st.capture || {};
  const DETECT_INTERVAL = cap.detect_interval_ms || 120;
  const DETECT_WIDTH = cap.detect_frame_max_width || 640;
  const CAPTURE_WIDTH = cap.capture_max_width || 2048;

  let sessionId = null, stream = null, closed = false, looping = false, busy = false;
  let result = null;                 // /card/capture の戻り
  let values = {};                   // 確認画面で編集中の値
  let detectCanvas = null, detectCtx = null, shotCanvas = null, shotCtx = null;

  const root = document.createElement("div");
  root.id = "card-ov";
  root.style.cssText = "position:absolute;inset:0;z-index:9600;background:rgba(20,18,14,.55);display:flex;align-items:center;justify-content:center;font-family:'Noto Sans JP',Inter,system-ui,sans-serif";
  sc.appendChild(root);

  const g = (id) => root.querySelector("#" + id);

  function close() {
    if (closed) return;
    closed = true;
    stopCamera();
    if (sessionId) {
      // セッション破棄 = 端末メモリ上の画像と抽出結果の破棄。失敗しても TTL で消える。
      fetch(`/card/session/${sessionId}`, { method: "DELETE" }).catch(() => {});
      sessionId = null;
    }
    root.remove();
    voice.pop();
    if (dbg.el) { dbg.el.remove(); dbg.el = null; }
  }
  CLEANUPS.push(close);
  // 読み取り中は下の受付フォームではなく、この画面の「撮影する」「戻る」を声で押せる。
  const voice = voiceCommandsLayer("card", root);

  // ── デバッグ表示(?carddebug=1) ─────────────────────────────────────────────
  // 画面に出るのは案内文言だけなので、うまく読めないときに何を直せばよいか分からない。
  // ここでは「検出の由来・品質の数値・直近の通信エラー・撮影結果」をそのまま出す。
  // root は再描画のたびに innerHTML を捨てるので、パネルは root の外(sc)に置く。
  const dbg = { el: null, frame: null, ms: 0, err: "", shot: "", times: [] };

  function dbgSetup() {
    if (!CARD_DEBUG || dbg.el) return;
    dbg.el = document.createElement("div");
    dbg.el.style.cssText = "position:absolute;right:26px;bottom:26px;z-index:9700;width:600px;padding:16px 18px;background:rgba(12,10,8,.88);color:#cfe9b6;border:1px solid rgba(255,255,255,.22);border-radius:14px;font-family:'JetBrains Mono',monospace;font-size:18px;line-height:1.6;white-space:pre-wrap;pointer-events:none";
    sc.appendChild(dbg.el);
    dbgPaint();
  }

  function dbgFrame(r, ms) {
    if (!CARD_DEBUG) return;
    dbg.frame = r; dbg.ms = ms;
    const now = performance.now();
    dbg.times.push(now);
    while (dbg.times.length > 12) dbg.times.shift();
    dbgPaint();
  }

  function dbgNote(where, e) {
    if (!CARD_DEBUG) return;
    const code = e && e.status ? e.status + " " : "";
    dbg.err = `${new Date().toLocaleTimeString()} ${where}: ${code}${(e && e.message) || e || "失敗"}`;
    dbgPaint();
  }

  function dbgCapture(r, ms) {
    if (!CARD_DEBUG) return;
    const filled = r && r.fields
      ? CARD_FIELD_ORDER.filter(k => r.fields[k] && r.fields[k].value).length : 0;
    dbg.shot = r
      ? `受理=${r.accepted} 理由=${r.accept_reason} 進む=${r.proceed} ${r.attempt}/${r.max_attempts}回目 `
        + `overall=${(r.overall ?? 0).toFixed(2)} 項目=${filled}/${CARD_FIELD_ORDER.length} ${Math.round(ms)}ms`
      : `撮影に失敗 ${Math.round(ms)}ms`;
    dbgPaint();
  }

  // 表示の組み立てで失敗しても読み取りは続ける。デバッグ表示はあくまで覗き窓で、
  // ここで例外を投げると検出ループが止まり、調べたかった症状ごと変わってしまう。
  function dbgPaint() {
    try { dbgPaintInner(); } catch {}
  }

  function dbgPaintInner() {
    if (!dbg.el) return;
    const r = dbg.frame, m = (r && r.metrics) || {};
    const t = dbg.times;
    // 実測のフレーム数。間隔が 0 になることがある(時刻の解像度が粗い環境)ので割らない。
    const span = t.length > 1 ? t[t.length - 1] - t[0] : 0;
    const fps = span > 0 ? ((t.length - 1) * 1000 / span).toFixed(1) : "-";
    const src = r ? (r.source === "text" ? "文字" : r.source === "edge" ? "縁" : "検出なし") : "-";
    const num = (v, d = 2) => (typeof v === "number" ? v.toFixed(d) : "-");
    dbg.el.textContent = [
      `engine=${st.engine || "?"} ${DETECT_WIDTH}px/${DETECT_INTERVAL}ms  実測 ${fps}fps  1枚 ${Math.round(dbg.ms)}ms`,
      r ? `state=${r.state} 由来=${src} 静止=${r.steady}/${r.steady_needed}` : "まだ応答がありません",
      `focus=${num(m.focus, 0)} bright=${num(m.brightness, 0)} glare=${num(m.glare, 3)} motion=${num(m.motion, 3)}`,
      `area=${num(m.area, 3)} fill=${num(m.fill, 3)} asp=${num(m.aspect)} 文字=${m.text_regions ?? "-"} 字高=${num(m.text_height, 1)}px${m.text_clipped ? " 見切れ" : ""}`,
      dbg.shot ? `撮影: ${dbg.shot}` : "撮影: まだ",
      dbg.err ? `直近のエラー: ${dbg.err}` : "通信エラー: なし",
    ].join("\n");
  }

  function stopCamera() {
    looping = false;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  }

  // ── スキャン画面 ───────────────────────────────────────────────────────────
  function renderScan(msg) {
    root.innerHTML = `
<div style="width:1760px;height:960px;background:${T.bg};border-radius:28px;box-shadow:0 30px 90px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden">
  <div style="padding:26px 40px;border-bottom:1px solid ${T.border};display:flex;align-items:center;gap:20px;flex-shrink:0">
    <div>
      <div style="font-size:40px;font-weight:600;color:${T.ink};letter-spacing:-1px">名刺を読み取ります</div>
      <div style="font-size:20px;color:${T.muted};font-family:Inter,system-ui,sans-serif;margin-top:2px">Scan your business card</div>
    </div>
    <div style="flex:1"></div>
    <button id="cd-cancel" style="min-height:72px;padding:0 40px;background:${T.canvas};border:2px solid ${T.borderStrong};border-radius:999px;font-size:26px;font-weight:600;color:${T.sub};cursor:pointer;font-family:inherit">← 戻る</button>
  </div>
  <div style="flex:1;display:flex;gap:28px;padding:28px 40px;min-height:0">
    <div id="cd-box" style="position:relative;flex:1;background:#14110d;border-radius:20px;overflow:hidden;min-width:0">
      <video id="cd-vid" muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain"></video>
      <canvas id="cd-ov" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
      <div id="cd-msg" style="position:absolute;left:0;right:0;bottom:0;padding:28px 32px;background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,0));color:#fff">
        <div id="cd-msg-ja" style="font-size:34px;font-weight:600;text-shadow:0 2px 12px rgba(0,0,0,.6)">${escHtml(msg || "カメラを準備しています")}</div>
        <div id="cd-msg-en" style="font-size:19px;opacity:.75;margin-top:6px;font-family:Inter,system-ui,sans-serif">Starting camera</div>
      </div>
      <div id="cd-steady" style="position:absolute;left:32px;top:32px;display:flex;gap:8px"></div>
      <div id="cd-attempt" style="position:absolute;right:32px;top:30px;color:rgba(255,255,255,.82);font-size:19px;font-family:'JetBrains Mono',monospace;text-shadow:0 2px 10px rgba(0,0,0,.6)"></div>
    </div>
    <div style="width:520px;display:flex;flex-direction:column;gap:20px;flex-shrink:0">
      <div style="background:${T.canvas};border:2px solid ${T.border};border-radius:18px;padding:26px 28px">
        <div style="font-size:24px;font-weight:600;color:${T.ink};margin-bottom:14px">きれいに読み取るコツ</div>
        <div style="font-size:21px;color:${T.sub};line-height:1.85">
          ・名刺を枠いっぱいに写す<br>
          ・まっすぐ置いて動かさない<br>
          ・照明の映り込みを避ける
        </div>
      </div>
      <div style="background:${T.panel};border:2px solid ${T.border};border-radius:18px;padding:26px 28px;font-size:20px;color:${T.sub};line-height:1.8">
        読み取りはこの端末の中だけで行います。名刺の画像が外部に送られることはなく、受付が終わると消去されます。
      </div>
      <div style="flex:1"></div>
      <button id="cd-shot" style="width:100%;min-height:104px;background:${T.dark};border:none;border-radius:18px;color:#fff;font-size:32px;font-weight:600;cursor:pointer;font-family:inherit">撮影する</button>
      <div style="font-size:19px;color:${T.muted};text-align:center">自動で撮影されないときはこちら</div>
    </div>
  </div>
</div>`;
    g("cd-cancel").addEventListener("click", () => { close(); });
    g("cd-shot").addEventListener("click", () => { capture(true); });
  }

  function setMessage(ja, en) {
    const a = g("cd-msg-ja"), b = g("cd-msg-en");
    if (a) a.textContent = ja || "";
    if (b) b.textContent = en || "";
  }

  function setSteady(n, need) {
    const el = g("cd-steady");
    if (!el) return;
    let html = "";
    for (let i = 0; i < need; i++) {
      const on = i < n;
      html += `<div style="width:22px;height:8px;border-radius:4px;background:${on ? bc : "rgba(255,255,255,.28)"}"></div>`;
    }
    el.innerHTML = html;
  }

  // 四隅は「送ったフレームに対する比」で返ってくる。映像は object-fit:contain なので、
  // 実際に描画されている矩形(レターボックスを除いた部分)へ写し直す。
  function drawQuad(quad, state) {
    const cv = g("cd-ov"), vid = g("cd-vid");
    if (!cv || !vid) return;
    const box = g("cd-box");
    const cw = box.clientWidth, ch = box.clientHeight;
    if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
    const ctx = cv.getContext("2d");
    ctx.clearRect(0, 0, cw, ch);
    if (!quad || !vid.videoWidth) return;
    const scale = Math.min(cw / vid.videoWidth, ch / vid.videoHeight);
    const dw = vid.videoWidth * scale, dh = vid.videoHeight * scale;
    const ox = (cw - dw) / 2, oy = (ch - dh) / 2;
    const pts = quad.map(([rx, ry]) => [ox + rx * dw, oy + ry * dh]);
    const good = state === "steady" || state === "capturing";
    ctx.lineWidth = 5;
    ctx.strokeStyle = good ? bc : "rgba(255,255,255,.85)";
    ctx.setLineDash(good ? [] : [16, 12]);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.stroke();
    if (good) { ctx.fillStyle = "rgba(255,255,255,.10)"; ctx.fill(); }
    ctx.setLineDash([]);
    ctx.fillStyle = good ? bc : "rgba(255,255,255,.9)";
    pts.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill(); });
  }

  async function startCamera() {
    try {
      const s = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
      });
      if (closed) { s.getTracks().forEach(t => t.stop()); return; }
      stream = s;
      const vid = g("cd-vid");
      if (vid) { vid.srcObject = stream; await vid.play().catch(() => {}); }
      const started = await cardApi("POST", "/card/session", {});
      if (closed) return;
      sessionId = started.session_id;
      looping = true;
      setMessage("名刺を枠内に入れてください", "Place your card inside the frame");
      dbgSetup();
      loop();
    } catch (e) {
      dbgSetup();
      dbgNote("カメラ/セッション開始", e);
      if (!closed) setMessage("カメラを起動できませんでした", "Camera unavailable");
    }
  }

  // 映像から 1 枚切り出して JPEG にする。検出ループ用(小さく速く)と撮影用(大きく綺麗に)で
  // キャンバスを分けて使い回す。毎フレーム作り直すと GC が効いて描画が引っかかる。
  function frameBlob(kind, width, quality) {
    const vid = g("cd-vid");
    if (!vid || !vid.videoWidth) return null;
    const w = Math.min(width, vid.videoWidth);
    const h = Math.round(vid.videoHeight * (w / vid.videoWidth));
    let cv, ctx;
    if (kind === "detect") {
      if (!detectCanvas) { detectCanvas = document.createElement("canvas"); detectCtx = detectCanvas.getContext("2d"); }
      cv = detectCanvas; ctx = detectCtx;
    } else {
      if (!shotCanvas) { shotCanvas = document.createElement("canvas"); shotCtx = shotCanvas.getContext("2d"); }
      cv = shotCanvas; ctx = shotCtx;
    }
    cv.width = w; cv.height = h;
    ctx.drawImage(vid, 0, 0, w, h);
    return new Promise(res => cv.toBlob(res, "image/jpeg", quality));
  }

  async function loop() {
    if (!looping || closed) return;
    if (!busy) {
      busy = true;
      try {
        const blob = await frameBlob("detect", DETECT_WIDTH, 0.62);
        if (blob && sessionId && looping) {
          const t0 = performance.now();
          const r = await cardPostImage(`/card/frame?session_id=${sessionId}`, blob);
          dbgFrame(r, performance.now() - t0);
          if (!closed && looping) {
            setMessage(r.message, r.message_en);
            setSteady(r.steady, r.steady_needed);
            drawQuad(r.quad, r.state);
            if (r.should_capture) { busy = false; capture(false); return; }
          }
        }
      } catch (e) {
        // 1 フレームの失敗は無視して次へ。ただし黙って捨てると画面は初期文言のまま
        // 止まり、「検出できない」と見分けがつかないのでデバッグ表示には残す。
        dbgNote("フレーム送信", e);
      }
      busy = false;
    }
    setTimeout(loop, DETECT_INTERVAL);
  }

  // 撮影して読み取る。
  //   force=false … 自動撮影。項目が取れていなければ確認画面へ進まず、黙って撮り直す
  //                （「撮れたのに何も入っていない確認画面」を利用者に見せないため）
  //   force=true  … 「撮影する」を押した場合。内容に関わらず確認画面へ進む
  // 何回まで撮り直すか(max_attempts)と間隔(retry_cooldown_sec)は端末側の設定。
  async function capture(force) {
    if (closed || !sessionId) return;
    looping = false;
    setMessage("名刺を読み取っています", "Reading the card");
    const shotAt = performance.now();
    try {
      const blob = await frameBlob("shot", CAPTURE_WIDTH, 0.92);
      if (!blob) throw new Error("no frame");
      const url = `/card/capture?session_id=${sessionId}${force ? "&force=1" : ""}`;
      const r = await cardPostImage(url, blob);
      dbgCapture(r, performance.now() - shotAt);
      if (closed) return;

      if (!r.proceed) {
        // 読み取れなかった。カメラは止めずにそのまま撮り直す。
        retryScan(r);
        return;
      }
      stopCamera();
      result = r;
      values = {};
      CARD_FIELD_ORDER.forEach(k => { values[k] = (r.fields[k] && r.fields[k].value) || ""; });
      confirm();
    } catch (e) {
      dbgNote("撮影", e);
      dbgCapture(null, performance.now() - shotAt);
      if (closed) return;
      retryScan(null);
    }
  }

  // 読み取れなかったときの撮り直し。利用者には「失敗」ではなく「続けてください」と伝える。
  function retryScan(r) {
    const attempt = (r && r.attempt) || 0;
    const total = (r && r.max_attempts) || 0;
    const wait = Math.round(((r && r.retry_cooldown_sec) || 0.8) * 1000);
    if (attempt >= 2) {
      // 2 回目以降は、直せそうな点を具体的に案内する
      setMessage("読み取れません。明るい場所で、名刺を枠いっぱいに写してください",
                 "Move to a brighter spot and fill the frame with the card");
    } else {
      setMessage("もう一度読み取ります。名刺はそのままでお待ちください",
                 "Reading again - please hold the card still");
    }
    const el = g("cd-attempt");
    if (el && total > 1) {
      el.textContent = attempt > 0 ? `読み取り ${attempt} 回目 / ${total}` : "";
    }
    looping = true;
    setTimeout(loop, wait);
  }

  // ── 確定 ──────────────────────────────────────────────────────────────────
  // **確認画面は挟まない。** 返す先の受付フォームが同じ 3 項目(お名前・会社名・部署)を
  // 編集できる画面なので、確認するだけの画面をもう 1 枚見せても利用者の手間が増える
  // だけだった。読み取れなかった項目はフォームの案内文で伝える。
  // confirm API はサーバ側のセッション(名刺画像と抽出結果)の破棄も兼ねる。
  async function confirm() {
    setMessage("受付フォームに入力しています", "Filling in the form");
    let payload = null;
    try {
      payload = await cardApi("POST", `/card/session/${sessionId}/confirm`, { values });
    } catch (e) {
      // 確定APIが落ちても読み取った値は手元にある(もともとどこにも保存しない)
      payload = { ...values };
    }
    sessionId = null;         // confirm でサーバ側は破棄済み
    close();
    if (typeof onConfirm === "function") onConfirm(payload);
  }

  renderScan();
  voice.set([vcItem("card.shot", "#cd-shot"), vcItem("common.back", "#cd-cancel")]);
  startCamera();
  return { close };
}

// ─── 音声サービス (声で操作する / 実験導入) ─────────────────────────────────────
// マイクを握るのはブラウザではなく端末内の音声サービス(127.0.0.1:8181)。ブラウザは
// 「いまの画面で受け付ける言葉」を渡して状態をポーリングするだけで、音声は通らない。
//
// 使えない端末(マイク未接続・モデル未導入・サービス停止)では status が取れず、
// 「声で操作する」を描画しない = 従来どおりのタッチ操作だけが残る。
const VOICE = { status: null, inflight: null, retryTimer: null, retryMs: 0 };
// 音声サービスは別プロセス・別ポート。voice_input.yaml の server.port を変えたら
// ここも合わせる(既定 8181)。
const VOICE_BASE = "http://127.0.0.1:8181";

async function voiceApi(method, path, body) {
  const r = await fetch(VOICE_BASE + path, {
    method,
    headers: body != null ? { "Content-Type": "application/json" } : {},
    body: body != null ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({ detail: r.statusText }));
    throw new Error(e.detail ?? "voice request failed");
  }
  return r.status === 204 ? null : r.json();
}

// 利用可否を調べる。失敗しても例外は投げない(音声導線を隠すだけ)。
// **使えると分かるまで、間隔を空けて聞き直す**(3 秒から倍々で最大 30 秒)。Pi の起動時は
// ブラウザと音声サービスが同時に立ち上がり、音声サービスの準備(Python・Vosk の読み込み)が
// 間に合わないことがある。以前は 1 回きりで諦めていたので、ページを開き直すまで声の操作が
// 出なかった(再起動のたびに消え、kiosk-service.sh start でも本体が動いていれば戻らなかった)。
// 音声サービスを入れていない端末では 30 秒に 1 回 127.0.0.1 へ問い合わせて断られるだけ。
// ?mock=1&voice=1 … MOCK のまま音声サービス(127.0.0.1:8181)だけ本物につなぐ。開発機で
// 「声で操作する」を試すため(キオスク本体を起動すると OTA が master の版で上書きする)。
// 明示オプトインで、覚えない(毎回 URL に付ける)。本番は MOCK でないので関係しない。
const MOCK_VOICE = (() => {
  try { return new URLSearchParams(location.search).get("voice") === "1"; } catch { return false; }
})();

async function ensureVoiceStatus() {
  if (VOICE.status) return VOICE.status;
  if (MOCK && !MOCK_VOICE) return null;
  if (VOICE.inflight) return VOICE.inflight;
  VOICE.inflight = (async () => {
    try {
      const s = await voiceApi("GET", "/voice/status");
      VOICE.status = s && s.available ? s : null;
    } catch { VOICE.status = null; }
    VOICE.inflight = null;
    clearTimeout(VOICE.retryTimer);
    VOICE.retryTimer = null;
    if (VOICE.status) {
      VOICE.retryMs = 0;
      // 画面の登録(voiceCommands)のほうが先に済んでいるので、ここで自動で入る。
      try { vcAutoEnter(); vcPaint(); } catch {}
    } else {
      VOICE.retryMs = Math.min(30000, VOICE.retryMs ? VOICE.retryMs * 2 : 3000);
      VOICE.retryTimer = setTimeout(() => { ensureVoiceStatus().catch(() => {}); }, VOICE.retryMs);
    }
    return VOICE.status;
  })();
  return VOICE.inflight;
}

// 聞き取り開始の合図。鳴り終わるまで待ってから解決する(端末の音をマイクが拾わないように)。
function playStartChime() {
  return new Promise(resolve => {
    let ctx = null;
    const level = tapVolume();
    try { ctx = _ensureTapAudio(); } catch { ctx = null; }
    if (!ctx || level <= 0) { setTimeout(resolve, 80); return; }
    try {
      if (ctx.state === "suspended") ctx.resume();
      const t = ctx.currentTime;
      const master = ctx.createGain();
      master.gain.value = 0.28 * level;
      master.connect(ctx.destination);
      // 低→高の2音。「どうぞ」の合図とわかる短い上昇。
      [[784, 0], [1175, 0.11]].forEach(([hz, at]) => {
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = "sine"; osc.frequency.value = hz;
        osc.connect(g); g.connect(master);
        g.gain.setValueAtTime(0, t + at);
        g.gain.linearRampToValueAtTime(0.75, t + at + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + at + 0.20);
        osc.start(t + at); osc.stop(t + at + 0.22);
      });
      // 鳴り終わり + 余韻ぶん待ってから解決する。サービス側でも頭の 250ms を
      // 捨てているので二重の対策になる。
      setTimeout(resolve, 520);
    } catch { setTimeout(resolve, 80); }
  });
}

// 端末が鳴らしている音を止める(案内の再生中は聞き取らない)。
// **音の出ないもの(QR・名刺のカメラ映像)は止めない。** 止めるとようこそ画面のQR読み取りが
// 最後の1コマのまま固まる(音声モードが自動で入るようになって、毎回踏むようになった)。
function stopKioskAudio() {
  try {
    document.querySelectorAll("video, audio").forEach(el => {
      if (el.muted || el.srcObject) return;
      try { el.pause(); } catch {}
    });
  } catch {}
}

// ─── 声で操作する (キーワードによる画面操作 / 実験導入・段階2) ─────────────────
// 音声モードの間は**画面が選択を待っている間だけ**マイクを開けて、その画面で意味のある言葉だけを
// 受け付ける(Doc/kiosk-voice-touchless.html §02・§06・§11 段階2)。待機画面へ戻ると抜ける。
// 入り方は 2 通り。音声サービスの command.auto_start が true(既定)なら、語彙を持つ画面が
// 出た時点で**押さなくても**入る(vcAutoEnter)。来訪者が「声の操作をやめる」を押したら、その人の
// 間(待機画面へ戻るまで)は自動では入らない。false なら下部帯の「声で操作する」を押したときだけ。
// 待機画面(動画)ではマイクを開けない＝前を通る人の会話を聞き続けることはしない。
//
// 画面のボタンは**ほぼすべて声でも押せる**(2026-10-02 利用者の指示で広げた)。ただし
// 人が動く・物が動くもの(受付の送信・担当者を呼ぶ・配達の呼び出し・ロッカーの口・扉を閉めました)は、
// 声で選んだときだけ「〜しますか？ はい/いいえ」の確認(vcConfirm)を挟む。雑談の誤爆で通知が
// 飛んだり錠が動いたりしないように(設計案 §08「復唱→はい」)。タッチで押したときは従来どおりすぐ動く。
// 声にしないのは 暗証番号(この画面ではマイクを開けない＝ロビーで番号を読み上げさせない)と、
// 文字を打つキーボード(受付フォームの五十音・変換候補)だけ。
//
// 各画面は描画のあとに voiceCommands(画面名, 選択肢) で「いま受け付ける言葉」を登録する。
// 選択肢の target に要素を渡すと、当たったときにその要素を押したのと同じことが起き、
// 音声モード中はその要素に「言う言葉」の札が付く(画面に書いてある言葉 = 受け付ける言葉)。
//
// 言葉は下の VOICE_VOCAB に集める。scripts/voice_command_eval.py と
// tests/voice_input/test_voice_command.py がこの表を JSON として読む(発音辞書にあるか・
// 誤爆しないかを測る)ので、**JSON として書くこと**。
// - 同じ読みを 2 通りの表記で並べない(「戻る」と「もどる」)。信頼度が半分ずつに割れて、
//   どちらも当たらなくなる(voice/vosk_engine.py に実測)。音の近い言い回し(「受け取る」と
//   「受け取り」)も同じで、同じ選択肢どうしでも割れる。画面の表記に近いほうを 1 つ選ぶ
// - 番号は語彙を絞ると「一番」しか当たらない(「二番」は数字が発話頭の雑音に吸われて「番」だけが
//   残る)。ロッカーは口数が 7 まで増えるので番号で選ばせ、その画面だけ音声サービスが通常の認識で
//   聞き直す(voiceCommands の opts.fallback)。ご用件の番号札は言葉のほうを頼りにする
// - label は札に出す言葉。**読み仮名(ひらがな)で書く**(「預ける」「置き配」は読みに迷う)。
//   カタカナ語(ロッカー・キーボード)はそのまま。label どおりに言えば say のどれかに当たること
// sayEn/labelEn = 英語モード(LANG==="en")で使う語彙。英語は最初から単語間にスペースが
