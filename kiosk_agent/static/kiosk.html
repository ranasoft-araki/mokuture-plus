        ["q","w","e","r","t","y","u","i","o","p"],
        ["a","s","d","f","g","h","j","k","l"],
        ["z","x","c","v","b","n","m"],
      ],
      upper: [
        ["Q","W","E","R","T","Y","U","I","O","P"],
        ["A","S","D","F","G","H","J","K","L"],
        ["Z","X","C","V","B","N","M"],
      ],
      num: [
        ["1","2","3","4","5","6","7","8","9","0"],
        ["-","/",";",":","(",")","$","&","@","\""],
        [".",",","?","!","'","#","%"],
      ],
      sym: [
        ["[","]","{","}","<",">","=","+","_","\\"],
        ["|","`","~","^","*","€","£","¥","•"],
        [".",",","?","!","'","#","%"],
      ],
    };

    function syncInput() {
      input.value = password;
      metaDiv.textContent = password ? `${password.length} 文字入力中` : "タッチキーボードで入力できます";
    }

    function addChars(chars) {
      if (!chars) return;
      password += chars;
      errDiv.textContent = "";
      syncInput();
    }

    function backspace() {
      if (!password) return;
      password = password.slice(0, -1);
      errDiv.textContent = "";
      syncInput();
    }

    function buildWifiKeyboardHtml() {
      const rows = WIFI_KB_ROWS[kbMode];
      const rowHtml = rows.map((row, idx) => {
        const keys = row.map((key) => `<button type="button" data-kb-key="${escHtml(key)}" ${btnPrevent} style="${keyStyle}">${escHtml(key)}</button>`).join("");
        if (idx === 2) {
          return `<div style="display:flex;gap:8px;justify-content:center">
            <button type="button" data-kb-action="shift" ${btnPrevent} style="${ctrlStyle};min-width:112px">${kbMode === "upper" ? "小文字" : "大文字"}</button>
            ${keys}
            <button type="button" data-kb-action="backspace" ${btnPrevent} style="${ctrlStyle};min-width:112px">⌫</button>
          </div>`;
        }
        return `<div style="display:flex;gap:8px;justify-content:center">${keys}</div>`;
      }).join("");
      return `
        <div style="display:flex;gap:8px;margin-bottom:4px">
          <button type="button" data-kb-mode="lower" ${btnPrevent} style="${modeStyle(kbMode === "lower")}">abc</button>
          <button type="button" data-kb-mode="upper" ${btnPrevent} style="${modeStyle(kbMode === "upper")}">ABC</button>
          <button type="button" data-kb-mode="num" ${btnPrevent} style="${modeStyle(kbMode === "num")}">123</button>
          <button type="button" data-kb-mode="sym" ${btnPrevent} style="${modeStyle(kbMode === "sym")}">#+=</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${rowHtml}
          <div style="display:flex;gap:8px;justify-content:center">
            <button type="button" data-kb-action="clear" ${btnPrevent} style="${ctrlStyle};min-width:112px">クリア</button>
            <button type="button" data-kb-action="space" ${btnPrevent} style="${ctrlStyle};flex:1;max-width:520px">スペース</button>
            <button type="button" data-kb-action="done" ${btnPrevent} style="${ctrlStyle};min-width:112px;background:${C.mossSoft};border-color:${C.moss};color:${C.mossDk}">入力完了</button>
          </div>
        </div>`;
    }

    function renderWifiKeyboard() {
      kbRoot.innerHTML = buildWifiKeyboardHtml();
    }

    function toggleVisibility() {
      visible = !visible;
      input.type = visible ? "text" : "password";
      visBtn.textContent = visible ? "非表示" : "表示";
    }

    const kbAction = (e) => {
      const btn = e.target.closest("button");
      if (!btn || !kbRoot.contains(btn)) return;
      e.preventDefault();
      const key = btn.getAttribute("data-kb-key");
      const mode = btn.getAttribute("data-kb-mode");
      const action = btn.getAttribute("data-kb-action");
      if (key != null) { addChars(key); return; }
      if (mode) { kbMode = mode; renderWifiKeyboard(); return; }
      if (action === "shift") {
        kbMode = kbMode === "upper" ? "lower" : "upper";
        renderWifiKeyboard();
        return;
      }
      if (action === "backspace") { backspace(); return; }
      if (action === "clear") {
        password = "";
        errDiv.textContent = "";
        syncInput();
        return;
      }
      if (action === "space") { addChars(" "); return; }
      if (action === "done") {
        okBtn.focus();
        return;
      }
    };

    renderWifiKeyboard();
    syncInput();
    input.focus();
    document.getElementById("ks-pw-cancel").addEventListener("click", () => overlay.remove());
    visBtn.addEventListener("click", toggleVisibility);
    kbRoot.addEventListener("mousedown", kbAction);
    kbRoot.addEventListener("touchstart", kbAction, { passive: false });
    async function doConnect() {
      if (!password) {
        errDiv.textContent = "パスワードを入力してください";
        return;
      }
      okBtn.disabled = true; okBtn.textContent = "接続中…";
      errDiv.textContent = "";
      try {
        const resp = await fetch("/device/wifi/connect", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ssid: net.ssid, password}),
        });
        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          errDiv.textContent = data.detail ?? "接続に失敗しました";
          okBtn.disabled = false; okBtn.textContent = "接続する";
        } else {
          overlay.remove();
          await loadNetworks();
        }
      } catch(e) {
        errDiv.textContent = "通信エラーが発生しました";
        okBtn.disabled = false; okBtn.textContent = "接続する";
      }
    }
    okBtn.addEventListener("click", doConnect);
    input.addEventListener("keydown", e => { if (e.key === "Enter") doConnect(); });
  }

  async function tryWifiConnect(net, password) {
    const resp = await fetch("/device/wifi/connect", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ssid: net.ssid, password: password || ""}),
    });
    if (resp.ok) return { ok: true, data: await resp.json().catch(() => ({})) };
    const data = await resp.json().catch(() => ({}));
    return {
      ok: false,
      status: resp.status,
      detail: data.detail ?? "接続に失敗しました",
    };
  }

  function wifiNeedsPassword(detail) {
    const msg = String(detail || "").toLowerCase();
    return [
      "secrets were required",
      "no secrets were provided",
      "password",
      "psk",
      "passphrase",
      "802-11-wireless-security",
      "wifi network could not be found",
      "insufficient privileges to complete the operation",
    ].some(t => msg.includes(t));
  }

  function showLockerUnlockAllDialog() {
    const overlay = document.createElement("div");
    overlay.style.cssText = `position:absolute;inset:0;background:rgba(29,26,21,.6);display:flex;align-items:center;justify-content:center;z-index:99`;
    overlay.innerHTML = `<div style="background:#fffefb;border-radius:20px;padding:44px 52px;width:700px;box-shadow:0 24px 64px rgba(0,0,0,.3)">
      <div style="font-size:24px;font-weight:600;color:#1d1a15;margin-bottom:8px">ロッカーの鍵を全解除しますか？</div>
      <div style="font-size:15px;color:#8a8276;line-height:1.7;margin-bottom:22px">全ロッカーを解錠し、利用状態と暗証番号をリセットします。中のお荷物が取り出せる状態になります。緊急・メンテナンス用です。</div>
      <div id="ks-la-msg" style="font-size:15px;color:#5a5249;min-height:22px;margin-bottom:16px"></div>
      <div style="display:flex;gap:14px">
        <button id="ks-la-cancel" style="flex:1;padding:16px;border-radius:12px;border:2px solid #d4cfc7;background:transparent;font-size:16px;color:#5a5249;cursor:pointer;font-family:inherit">キャンセル</button>
        <button id="ks-la-ok" style="flex:1;padding:16px;border-radius:12px;border:none;background:#b87c2e;color:#fffefb;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit">全解除する</button>
      </div>
    </div>`;
    document.getElementById("ks-root").appendChild(overlay);
    const msg = document.getElementById("ks-la-msg");
    const ok = document.getElementById("ks-la-ok");
    document.getElementById("ks-la-cancel").addEventListener("click", () => overlay.remove());
    ok.addEventListener("click", async () => {
      ok.disabled = true; ok.textContent = "解錠中…"; msg.style.color = "#5a5249"; msg.textContent = "";
      const token = localStorage.getItem(TOKEN_KEY);
      try {
        const r = await devicePost("/device/lockers/open-all");
        const doors = (r && r.door_numbers) || [];
        for (const d of doors) { await pulseLocker(d); }
        msg.style.color = "#2e5c32";
        msg.textContent = `全 ${r && r.count != null ? r.count : doors.length} 台を解錠しました。`;
        ok.textContent = "完了";
        setTimeout(() => overlay.remove(), 1800);
      } catch (e) {
        msg.style.color = "#c0392b";
        msg.textContent = "失敗しました：" + ((e && e.message) || "もう一度お試しください");
        ok.disabled = false; ok.textContent = "全解除する";
      }
    });
  }

  async function loadNetworks() {
    wifiLoading = true; render();
    try {
      const data = await fetch("/device/wifi/networks").then(r => r.json());
      networks = data.networks ?? [];
      console.warn("[kiosk] wifi networks:", networks.length, networks.map(n => ({ssid:n.ssid, connected:n.connected, signal:n.signal, known:n.known})));
      if (data.debug) console.warn("[kiosk] wifi debug:", data.debug);
      wifiError = data.error ?? "";
      if (wifiError) console.warn("[kiosk] wifi:", wifiError);
    } catch(e) {
      networks = [];
      wifiError = e && e.message ? e.message : "一覧取得に失敗しました";
      console.warn("[kiosk] wifi:", wifiError);
    }
    wifiLoading = false; render();
  }

  function bindEvents() {
    document.getElementById("ks-back").addEventListener("click", () => { stopDeviceCheck(); go("idle"); });

    // タブ切替(両タブ共通)
    document.querySelectorAll("[data-tab]").forEach(btn => {
      btn.addEventListener("click", () => {
        const t = btn.getAttribute("data-tab");
        if (t === activeTab) return;
        if (activeTab === "devices") stopDeviceCheck();
        activeTab = t;
        render();
      });
    });

    // デバイス情報フッター 5 連タップで再登録(両タブ共通)
    const devEl = document.getElementById("ks-dev");
    if (devEl) devEl.addEventListener("click", handleDevTap);

    // ここから先は設定タブのみのバインド
    if (activeTab !== "settings") return;

    const unbindBtn = document.getElementById("ks-unbind");
    if (unbindBtn) unbindBtn.addEventListener("click", unbindDevice);

    const lockerAll = document.getElementById("ks-locker-all");
    if (lockerAll) lockerAll.addEventListener("click", showLockerUnlockAllDialog);

    document.querySelectorAll("[data-lcount]").forEach(btn => {
      btn.addEventListener("click", () => {
        const c = parseInt(btn.getAttribute("data-lcount"), 10);
        if (c && c !== (lockerCfg && lockerCfg.count)) setLockerCount(c);
      });
    });

    document.getElementById("ks-vol-minus").addEventListener("click", () => {
      vol = Math.max(0, vol - 5); updateVol();
    });
    document.getElementById("ks-vol-plus").addEventListener("click", () => {
      vol = Math.min(100, vol + 5); updateVol();
    });

    const track = document.getElementById("ks-vol-track");
    function volFromPointer(clientX) {
      const r = track.getBoundingClientRect();
      vol = Math.round(Math.max(0, Math.min(100, (clientX - r.left) / r.width * 100)));
      updateVol();
    }
    track.addEventListener("mousedown", e => {
      volFromPointer(e.clientX);
      function mm(e2) { volFromPointer(e2.clientX); }
      document.addEventListener("mousemove", mm);
      document.addEventListener("mouseup", () => document.removeEventListener("mousemove", mm), { once:true });
    });
    track.addEventListener("touchstart", e => volFromPointer(e.touches[0].clientX), { passive:true });
    track.addEventListener("touchmove",  e => volFromPointer(e.touches[0].clientX), { passive:true });

    document.querySelectorAll("[data-sound]").forEach(row => {
      row.addEventListener("click", () => {
        const k = row.getAttribute("data-sound");
        sounds[k] = !sounds[k];
        localStorage.setItem("kiosk_snd_" + k, sounds[k] ? "on" : "off");
        render();
      });
    });

    document.getElementById("ks-test").addEventListener("click", () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = "sine"; osc.frequency.value = 880;
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.3 * vol / 100, ctx.currentTime + 0.05);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.65);
      } catch(e) {}
    });

    document.getElementById("ks-mute").addEventListener("click", () => {
      vol = vol > 0 ? 0 : 70; updateVol();
    });

    document.getElementById("ks-wifi-toggle").addEventListener("click", async () => {
      wifiOn = !wifiOn;
      render();
      try {
        await fetch("/device/wifi/toggle", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({on: wifiOn}),
        });
        if (wifiOn) await loadNetworks();
      } catch(e) {}
    });

    document.getElementById("ks-rescan").addEventListener("click", () => loadNetworks());

    // Network row clicks
    const otherNets = networks.filter(n => !n.connected);
    document.querySelectorAll("[data-net]").forEach(row => {
      row.addEventListener("click", async () => {
        const idx = parseInt(row.getAttribute("data-net"));
        const net = otherNets[idx];
        if (!net) return;
        row.style.opacity = "0.5";
        try {
          if (net.lock && !net.known) {
            row.style.opacity = "1";
            showWifiPasswordDialog(net);
            return;
          }
          const result = await tryWifiConnect(net, "");
          if (result.ok) {
            await loadNetworks();
            return;
          }
          if (net.lock && wifiNeedsPassword(result.detail)) {
            row.style.opacity = "1";
            showWifiPasswordDialog(net);
            return;
          }
          console.warn("[kiosk] wifi connect failed:", result.detail);
          row.style.opacity = "1";
        } catch(e) {
          console.warn("[kiosk] wifi connect error:", e);
          row.style.opacity = "1";
        }
      });
    });
  }

  // Initial load: fetch volume + wifi from backend, then render
  async function init() {
    wifiLoading = true;
    settingsInitLoading = true;
    render();

    const [volRes, wifiRes, lockRes] = await Promise.allSettled([
      fetch("/device/volume").then(r => r.json()),
      fetch("/device/wifi/networks").then(r => r.json()),
      deviceGet("/device/locker-config"),
    ]);
    if (lockRes.status === "fulfilled" && lockRes.value && typeof lockRes.value.count === "number") {
      lockerCfg = lockRes.value;
    }
    if (volRes.status === "fulfilled" && !volRes.value.error) {
      vol = volRes.value.level ?? 70;
      localStorage.setItem("kiosk_vol", String(vol));   // タップ音(playPon)が参照する
    } else {
      if (volRes.status === "fulfilled" && volRes.value.error) {
        console.warn("[kiosk] volume:", volRes.value.error);
      }
      vol = getStoredVolumePercent();
    }
    if (wifiRes.status === "fulfilled") {
      networks = wifiRes.value.networks ?? [];
      console.warn("[kiosk] wifi init networks:", networks.length, networks.map(n => ({ssid:n.ssid, connected:n.connected, signal:n.signal, known:n.known})));
      if (wifiRes.value.debug) console.warn("[kiosk] wifi init debug:", wifiRes.value.debug);
      wifiError = wifiRes.value.error ?? "";
      if (wifiRes.value.error) console.warn("[kiosk] wifi:", wifiRes.value.error);
    } else {
      wifiError = "一覧取得に失敗しました";
    }
    wifiLoading = false;
    settingsInitLoading = false;
    render();
  }

  init();
  // フッターの版表示(デバイスチェックタブの「ソフトウェア更新」と同じ名前で出す)
  getUpdStatus().then(d => { if (d && !upd) { upd = d; renderUpd(); } });
}

// ─── Corner gesture: simultaneous top-left + top-right touch → kiosk settings ─
(function() {
  let lastTriggered = 0;
  const activePointers = new Map();

  function syncPointer(e) {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }

  function clearPointer(e) {
    activePointers.delete(e.pointerId);
  }

  document.addEventListener("pointerdown", function(e) {
    if (CURRENT_SCREEN === "kiosk-settings") return;
    const now = Date.now();
    if (now - lastTriggered < 2000) return;
    syncPointer(e);
    const pointers = Array.from(activePointers.values());
    if (pointers.length < 2) return;
    const W = window.innerWidth, EDGE = 160, TOP = 130;
    const hasTL = pointers.some(p => p.x < EDGE && p.y < TOP);
    const hasTR = pointers.some(p => p.x > W - EDGE && p.y < TOP);
    if (hasTL && hasTR) {
      lastTriggered = now;
      showKioskSettings();
    }
  }, { passive: true });
  ["pointerup", "pointercancel", "pointerleave", "lostpointercapture"].forEach((eventName) => {
    document.addEventListener(eventName, clearPointer, { passive: true });
  });
})();

// 分析ログ(匿名)の起動。?mock=1 のプレビューでは送らない(本番データを汚さないため)。
// 送信先は同一オリジンのエージェント(/device/oplog)で、デバイストークンは
// ブラウザのコードに持たせない(ANALYTICS.md §7)。二重起動しないよう1回だけ実行する。
let _anStarted = false;
function startAnalytics() {
  if (_anStarted || MOCK) return;
  _anStarted = true;
  try {
    const an = (CFG && CFG.analytics) || {};
    AN.init({
      enabled: true,
      appVersion: (CFG && CFG.app_version) || null,
      uiVersion: UI_VERSION,
      idleTimeoutSec: ST.kiosk_idle_timeout_sec || 60,
      flushMs: (an.flush_sec || 15) * 1000,
      maxBatch: an.max_batch || 200,
    });
    AN.bindAutoTracking(sc);   // 操作要素のタップを委譲で拾う(キーボード/変換候補は除外)
    // 離脱時は溜まっているぶんを送るだけ。**session_abandoned は出さない**
    // (リロードと区別できないため。再読込なら次の起動で同じセッションを復元する)。
    window.addEventListener("pagehide", () => AN.onPageHide());
    // 想定外の JS 例外。**メッセージ・スタックトレースは送らない**(入力値が混ざりうる)。
    window.addEventListener("error", () => AN.unexpectedError("unknown"));
    window.addEventListener("unhandledrejection", () => AN.unexpectedError("unknown"));
    // 受付アプリの起動完了を1回だけ知らせる（端末ログの app_started）。
    // ページ読み込み(browser_started/page_reloaded)とは別に「アプリが立ち上がりきった」を残す。
    fetch("/device/kiosk-heartbeat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...kioskHeartbeatPayload(), booted: true }),
    }).catch(() => {});
  } catch (e) { /* ログで起動を止めない */ }
}

async function boot() {
  sc.innerHTML = `<div style="width:1920px;height:1080px;background:#0a0806;display:flex;align-items:center;justify-content:center"><div style="color:rgba(255,255,255,.3);font-size:18px">読み込み中…</div></div>`;
  rescale();

  // ?mock=1: 完全モック(エージェント不要・python -m http.server でも可)
  if (MOCK) { return bootMock(); }

  // 通常起動: エージェントの /config を取得(mock 判定を含む)
  try {
    CFG = await apiGet("/config");
  } catch (e) {
    sc.innerHTML = `<div style="width:1920px;height:1080px;background:#0a0806;display:flex;align-items:center;justify-content:center"><div style="color:#f88;font-size:16px;text-align:center">エージェントに接続できません<br>${escHtml(e.message)}</div></div>`;
    rescale(); return;
  }

  // 実機でしか動かないハード(GPIO/PIR/カメラ/音量/WiFi)は agent 側で自動モックされる
  // (gpio.py の _MOCK / main.py の _MOCK_DEVICE=非Linuxで自動)。ブラウザは開発機でも
  // 常に実経路を通す: /proxy/* = 実バックエンド, /device/* = agent(ハード or モック)。
  // → 管理画面で設定した実データ(会議室マップ等)がそのまま表示される。
  // バックエンド不要の完全オフラインプレビューは URL に ?mock=1 を付けた時のみ(明示オプトイン)。

  // トークンが無ければ自己登録。承認待ちなら showPending 済みで false が返る。
  if (!(await ensureRegistered())) return;
  const token = localStorage.getItem(TOKEN_KEY);

  // 名刺読み取りの利用可否(OCR モデル・依存パッケージの導入状況)を一度だけ確認する。
  // 使えない端末では受付フォームに「名刺で入力」を出さない。失敗しても起動は止めない。
  ensureCardStatus().catch(() => {});

  // 声で操作する(実験導入)の利用可否も同じく一度だけ。音声サービスは別プロセスなので、
  // 止まっていても・未導入でも、ここで届かないだけで受付は従来どおり動く。
  ensureVoiceStatus().catch(() => {});

  // Load settings + schedule in parallel
  try {
    const [settings, sched] = await Promise.all([
      apiGet("/proxy/settings").catch(() => null),
      apiGet("/proxy/schedule", token).catch(e => {
        if (e.message === "Invalid kiosk token") {
          localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(NAME_KEY);
        }
        return null;
      }),
    ]);
    // トークンが無効化された(承認前に削除された等) → 登録からやり直す
    if (!localStorage.getItem(TOKEN_KEY)) { return boot(); }
    if (settings) Object.assign(ST, settings);
    showDemoBadge();
    startAnalytics();
    if (sched?.device_name) localStorage.setItem(NAME_KEY, sched.device_name);
    if (sched?.pending) {
      showPending(sched?.device_name);
      return;
    } else if (sched?.suspended) {
      showSuspended();
    } else {
      ITEMS = sched?.playlist?.items ?? [];
      TRANSITION_TYPE = sched?.playlist?.transition_type ?? "fade";
      go("idle");
    }
  } catch {
    go("idle");
  }

  // boot() は再登録フォールバックから複数回呼ばれ得るため、ポーリングは一度だけ張る。
  if (_pollsStarted) return;
  _pollsStarted = true;

  // Poll schedule every 60 s
  setInterval(async () => {
    const t = localStorage.getItem(TOKEN_KEY);
    if (!t) return;
    try {
      const s = await apiGet("/proxy/schedule", t);
      syncDeviceName(s?.device_name);
      if (s?.pending) {
        if (CURRENT_SCREEN !== "pending") showPending(s?.device_name);
      } else if (s?.suspended) {
        if (CURRENT_SCREEN !== "suspended") showSuspended();
      } else {
        if (CURRENT_SCREEN === "suspended" || CURRENT_SCREEN === "pending") { ITEMS = s?.playlist?.items ?? []; TRANSITION_TYPE = s?.playlist?.transition_type ?? "fade"; go("idle"); }
        else { ITEMS = s?.playlist?.items ?? []; TRANSITION_TYPE = s?.playlist?.transition_type ?? "fade"; }
      }
    } catch {}
  }, 60000);

  // Poll /update-status every 30 s; apply when idle or force-flagged
  setInterval(async () => {
    try {
      const s = await fetch("/update-status").then(r => r.json());
      if (!s.ready) return;
      if (!s.force && CURRENT_SCREEN !== "idle") return;
      await fetch("/apply-update", { method: "POST" });
      setTimeout(() => location.reload(), 500);
    } catch {}
  }, 30000);
}

boot();

// Kiosk settings entry gestures / shortcuts.
// 追加・変更・削除しやすいよう、トリガー定義をここに集約する。
const KIOSK_SETTINGS_ENTRY = {
  cooldownMs: 2000,
  cornerZoneRatio: 0.10,
  sequenceWindowMs: 5000,
  triggers: [
    {
      id: "two-finger-top-corners",
      type: "simultaneous-corners",
      corners: ["top-left", "top-right"],
    },
    {
      id: "clockwise-corners",
      type: "corner-sequence",
      corners: ["top-left", "top-right", "bottom-right", "bottom-left"],
      allowRotation: true,
    },
    {
      id: "ctrl-shift-m",
      type: "key-chord",
      key: "m",
      ctrlKey: true,
      shiftKey: true,
    },
  ],
};

(function() {
  let lastTriggered = 0;
  const sequenceStates = new Map();
  const activePointers = new Map();

  function canOpenSettings(now = Date.now()) {
    return CURRENT_SCREEN !== "kiosk-settings" && (now - lastTriggered) >= KIOSK_SETTINGS_ENTRY.cooldownMs;
  }

  function resetSequenceStates() {
    sequenceStates.clear();
  }

  function openKioskSettings() {
    lastTriggered = Date.now();
    resetSequenceStates();
    activePointers.clear();
    showKioskSettings();
  }

  function syncPointer(e) {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }

  function clearPointer(e) {
    activePointers.delete(e.pointerId);
  }

  function getCornerFromPoint(x, y, zoneRatio = KIOSK_SETTINGS_ENTRY.cornerZoneRatio) {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const edgeX = w * zoneRatio;
    const edgeY = h * zoneRatio;
    const left = x <= edgeX;
    const right = x >= w - edgeX;
    const top = y <= edgeY;
    const bottom = y >= h - edgeY;

    if (left && top) return "top-left";
    if (right && top) return "top-right";
    if (right && bottom) return "bottom-right";
    if (left && bottom) return "bottom-left";
    return null;
  }

  function buildSequences(trigger) {
    const base = trigger.corners;
    if (!trigger.allowRotation) return [base];
    return base.map((_, idx) => base.slice(idx).concat(base.slice(0, idx)));
  }

  function isPrefix(progress, sequence) {
    return progress.every((corner, idx) => sequence[idx] === corner);
  }

  function advanceSequenceTrigger(trigger, touchedCorner, now) {
    const windowMs = trigger.windowMs ?? KIOSK_SETTINGS_ENTRY.sequenceWindowMs;
    const sequences = buildSequences(trigger);
    const current = sequenceStates.get(trigger.id);
    let state = current && (now - current.startedAt) <= windowMs
      ? current
      : { startedAt: now, progress: [] };

    let progress = state.progress.concat(touchedCorner);
    let matched = sequences.some((sequence) => isPrefix(progress, sequence));

    if (!matched) {
      progress = [touchedCorner];
      matched = sequences.some((sequence) => isPrefix(progress, sequence));
      if (!matched) progress = [];
    }

    if (progress.length === 1) state.startedAt = now;
    state.progress = progress;

    const completed = sequences.some((sequence) =>
      progress.length === sequence.length && isPrefix(progress, sequence)
    );
    if (completed) {
      openKioskSettings();
      return true;
    }

    if (progress.length > 0) sequenceStates.set(trigger.id, state);
    else sequenceStates.delete(trigger.id);
    return false;
  }

  document.addEventListener("pointerdown", function(e) {
    const now = Date.now();
    if (!canOpenSettings(now)) return;
    syncPointer(e);

    const touchTriggers = KIOSK_SETTINGS_ENTRY.triggers.filter((trigger) =>
      trigger.type === "simultaneous-corners" || trigger.type === "corner-sequence"
    );

    for (const trigger of touchTriggers) {
      if (trigger.type !== "simultaneous-corners") continue;
      const activeCorners = new Set(
        Array.from(activePointers.values())
          .map((pointer) => getCornerFromPoint(pointer.x, pointer.y, trigger.zoneRatio))
          .filter(Boolean)
      );
      const matched = trigger.corners.every((corner) => activeCorners.has(corner));
      if (matched) {
        e.stopImmediatePropagation();
        openKioskSettings();
        return;
      }
    }

    const touchedCorner = getCornerFromPoint(e.clientX, e.clientY);

    if (!touchedCorner) return;

    for (const trigger of touchTriggers) {
      if (trigger.type !== "corner-sequence") continue;
      if (advanceSequenceTrigger(trigger, touchedCorner, now)) {
        e.stopImmediatePropagation();
        return;
      }
    }
  }, { passive: true, capture: true });

  ["pointerup", "pointercancel", "pointerleave", "lostpointercapture"].forEach((eventName) => {
    document.addEventListener(eventName, clearPointer, { passive: true, capture: true });
  });

  document.addEventListener("keydown", function(e) {
    if (!canOpenSettings()) return;
    const matched = KIOSK_SETTINGS_ENTRY.triggers.some((trigger) =>
      trigger.type === "key-chord" &&
      (e.key || "").toLowerCase() === trigger.key.toLowerCase() &&
      (!!trigger.ctrlKey === e.ctrlKey) &&
      (!!trigger.shiftKey === e.shiftKey) &&
      (!!trigger.altKey === e.altKey) &&
      (!!trigger.metaKey === e.metaKey)
    );
    if (!matched) return;
    e.stopImmediatePropagation();
    openKioskSettings();
  }, true);
})();
</script>
</body>
</html>
